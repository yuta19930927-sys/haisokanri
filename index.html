<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#f3f4f6;
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    /* 【不具合の根本修正】これまで、何度か画面下部のナビゲーションが
       見切れる不具合を、中身の余白調整だけで対応しようとしていたが、
       毎回微妙な高さのズレで再発していた。
       根本原因は、html/body自体に「縦方向のスクロールを禁止する」
       設定が無かったこと。アプリの中身が1pxでも画面の高さからはみ出す
       と、「ページ全体」がブラウザの通常のスクロール対象になってしまい、
       ユーザーはページ全体をスライドしないと下部が見えなくなっていた。
       html/body自体を画面ちょうどの高さに固定し、外側のスクロール自体を
       禁止することで、中身のズレが起きても、必ずアプリ内部のスクロール
       領域（flex-1 overflow-y-auto）だけで完結するようにする。 */
    overflow: hidden;
    height: 100dvh;
    max-width: 100vw;
  }
  #root { height: 100%; overflow: hidden; }
  input, textarea, select, button { font-family: inherit; }
  button { min-height: 44px; }

  /* ホーム画面から全画面で起動したとき、iPhone の時計に画面が隠れて
     しまうのを防ぐ（上部の安全領域のみ、ここでbodyに適用する）。
     下部の安全領域（ホームバー避け）は、body ではなく、ナビゲーション
     バー自体に適用する（body に適用すると、アプリのフレーム全体が
     縮んでしまい、ナビゲーションバーが画面の絶対的な下端より上に
     来てしまい、その下に不要な余白ができてしまうため）。 */
  body {
    padding-top: env(safe-area-inset-top);
  }
  /* 全画面時は「スマホの枠」風の余白を消して、画面いっぱいに使う */
  @media (display-mode: standalone) {
    body { background: #f3f4f6; }
  }

  #boot-error {
    display: none;
    position: fixed; top:0; left:0; right:0; bottom:0; z-index: 9999;
    background: #fff; padding: 20px; overflow: auto;
    padding-top: calc(20px + env(safe-area-inset-top));
    font-family: ui-monospace, Menlo, monospace; font-size: 13px; line-height: 1.6;
  }
  #boot-error h1 { font-size: 16px; color: #c62828; margin: 0 0 12px; }
  #boot-error pre { background: #f5f5f5; padding: 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>

<div id="root"></div>

<div id="boot-error">
  <h1>起動できませんでした</h1>
  <p>下の内容をそのままコピーして送ってください。</p>
  <pre id="boot-error-msg"></pre>
</div>

<script>
/* 起動エラーを必ず画面に出す。
   iPhone では "Script error." に潰されて原因が分からなくなるため。 */
(function () {
  var shown = false;
  function show(msg) {
    if (shown) return;
    shown = true;
    var box = document.getElementById("boot-error");
    var pre = document.getElementById("boot-error-msg");
    if (box && pre) { pre.textContent = msg; box.style.display = "block"; }
  }
  window.addEventListener("error", function (e) {
    show(
      "メッセージ: " + (e.message || "(なし)") + "\n" +
      "場所: " + (e.lineno || "?") + "行 " + (e.colno || "?") + "文字目\n" +
      "詳細: " + ((e.error && (e.error.stack || e.error.message)) || "(なし)")
    );
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason;
    show("非同期エラー: " + ((r && (r.stack || r.message)) || String(r)));
  });
  window.__bootShowError = show;
})();
</script>

<script>
/* console の存在保証。
   iPhone のファイルアプリ（about:srcdoc）には console.info が存在せず、
   ログを出そうとしただけでアプリが起動不能になる（実際にこれで落ちた）。
   開発用のログでアプリが死ぬのは本末転倒なので、
   足りないメソッドは「何もしない関数」で必ず埋めておく。 */
(function () {
  if (typeof window.console === "undefined" || window.console === null) {
    window.console = {};
  }
  var noop = function () {};
  var methods = [
    "log", "info", "warn", "error", "debug", "trace",
    "dir", "table", "group", "groupEnd", "groupCollapsed",
    "time", "timeEnd", "assert", "count", "clear"
  ];
  for (var i = 0; i < methods.length; i++) {
    if (typeof window.console[methods[i]] !== "function") {
      window.console[methods[i]] = noop;
    }
  }
})();
</script>
